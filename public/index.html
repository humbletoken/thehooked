<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5fc8ff">
  <title>Hooked — рыбалка с друзьями</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- loading -->
    <section id="loading">
      <div class="ld-sky">
        <div class="ld-rays"></div>
        <div class="ld-sun"></div>
        <div class="ld-cloud c1"></div><div class="ld-cloud c2"></div><div class="ld-cloud c3"></div>
      </div>
      <div class="ld-center">
        <div class="logo" id="ld-logo"></div>
        <div class="ld-sub">рыбалка с друзьями</div>
      </div>
      <div class="ld-lake">
        <svg class="ld-wave w1" viewBox="0 0 800 60" preserveAspectRatio="none"><path d="M0,30 C100,10 200,50 300,30 C400,10 500,50 600,30 C700,10 800,50 900,30 L900,60 L0,60 Z"/></svg>
        <svg class="ld-wave w2" viewBox="0 0 800 60" preserveAspectRatio="none"><path d="M0,30 C100,50 200,10 300,30 C400,50 500,10 600,30 C700,50 800,10 900,30 L900,60 L0,60 Z"/></svg>
        <div class="ld-bubbles"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="ld-bottom">
        <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div><div class="ld-bob" id="ld-bob"></div></div>
        <div class="ld-tip" id="ld-tip">Наживляем червячка…</div>
      </div>
    </section>

    <!-- screens -->
    <main id="screens"></main>

    <!-- in-game HUD -->
    <section id="hud" hidden></section>

    <!-- bottom navigation -->
    <nav id="nav" hidden>
      <div class="nav-pill">
        <button class="nav-item" data-tab="shop" aria-label="Магазин"></button>
        <button class="nav-item" data-tab="home" aria-label="Рыбалка"></button>
        <button class="nav-item" data-tab="collection" aria-label="Коллекция"></button>
        <button class="nav-item" data-tab="info" aria-label="Инфо"></button>
        <span class="nav-blob"></span>
      </div>
      <button class="nav-profile" data-tab="profile" aria-label="Профиль"></button>
    </nav>

    <div id="modal-root"></div>
    <div id="toasts"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/net.js"></script>
  <script src="js/game.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
